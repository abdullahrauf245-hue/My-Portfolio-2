<svg width="180" height="180" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#c5ff41" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Premium dark backdrop squircle -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#0A0A0A" stroke="#1F1F1F" stroke-width="2"/>
  
  <!-- Decorative background diagonal lines -->
  <path d="M20 20 L80 80 M80 20 L20 80" stroke="url(#grad2)" stroke-width="1" stroke-dasharray="2 4" opacity="0.3" />
  
  <!-- Stylized Monogram "A" with data node theme -->
  <!-- Left pillar of A -->
  <path d="M31 73 L45 27 L53 27 L39 73 Z" fill="url(#grad1)" />
  
  <!-- Right pillar of A -->
  <path d="M69 73 L55 27 L47 27 L61 73 Z" fill="url(#grad1)" opacity="0.85" />
  
  <!-- Crossbar of A with subtle glowing effect -->
  <path d="M38 55 L62 55" stroke="url(#grad1)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Data Nodes -->
  <circle cx="45" cy="27" r="4" fill="#c5ff41" stroke="#0A0A0A" stroke-width="1.5" />
  <circle cx="55" cy="27" r="4" fill="#FF6B35" stroke="#0A0A0A" stroke-width="1.5" />
  <circle cx="31" cy="73" r="4" fill="#FF6B35" stroke="#0A0A0A" stroke-width="1.5" />
  <circle cx="69" cy="73" r="4" fill="#c5ff41" stroke="#0A0A0A" stroke-width="1.5" />
  <circle cx="50" cy="55" r="2.5" fill="#FFFFFF" />
</svg>
